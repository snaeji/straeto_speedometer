<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2306b6d4'/><text x='16' y='22' text-anchor='middle' font-size='16' font-weight='bold' fill='white'>S</text></svg>" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#030712" />
		<title>The Straeto Speedometer</title>
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// Inline analytics — bypasses script-blocking adblockers
			;(function() {
				if (localStorage.getItem('_notrack')) return;
				var d = {
					p: location.pathname + location.search,
					r: document.referrer,
					t: document.title,
					s: [window.innerWidth, window.innerHeight, devicePixelRatio || 1]
				};
				var url = 'https://straeto.goatcounter.com/count?' +
					Object.keys(d).map(function(k) {
						return encodeURIComponent(k) + '=' + encodeURIComponent(
							Array.isArray(d[k]) ? d[k].join(',') : d[k]
						);
					}).join('&');
				try { navigator.sendBeacon(url); }
				catch(e) { new Image().src = url; }
			})();
		</script>
	</body>
</html>
